name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Command and input
      description: The exact `dp` command you ran, and a minimal input sample that reproduces the issue.
      placeholder: |
        $ printf '{"a":1}\n' | dp filter '.a > 0'
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: dp version
      description: Output of `dp --version`
      placeholder: dp 0.2.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installed via
      options:
        - Prebuilt binary / install script
        - Homebrew
        - cargo install
        - Built from source
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, stack traces, or other context.
