[package]
name = "datapipe"
version = "0.1.0"
edition = "2021"
authors = ["Varun"]
description = "A high-performance, streaming-first CLI for structured data"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
indexmap = { version = "2.14.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
csv = "1.4.0"
miette = { version = "7.6.0", features = ["fancy"] }
rayon = "1.12.0"

[dev-dependencies]
assert_cmd = "2.0"
criterion = "0.8.2"
predicates = "3.0"

[[bin]]
name = "dp"
path = "src/main.rs"

[[bench]]
name = "bench"
harness = false

[lib]
name = "datapipe"
path = "src/lib.rs"
